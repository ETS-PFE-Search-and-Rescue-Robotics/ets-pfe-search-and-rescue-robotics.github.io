site_name: ÉTS PFE — Search & Rescue Robotics
site_description: Drone + rover search-and-rescue system — overview & handover
site_url: https://ets-pfe-search-and-rescue-robotics.github.io/
repo_url: https://github.com/ETS-PFE-Search-and-Rescue-Robotics
theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
nav:
  - Home: index.md
  - Hardware: hardware.md
  - Architecture: architecture.md
  - Repositories: repos.md
  - Handover: handover.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
